<!doctype html><html><head><meta charset="utf-8"><title>Paywall</title><link rel="stylesheet" href="style.css"></head><body>
<div class="phone" style="background:radial-gradient(700px 400px at 50% 0%,#6D28D9,transparent 60%),var(--bg)"><div class="screen-name">Paywall · Premium</div>
  <div class="scroll">
    <div class="status"></div>
    <div class="topbar"><div class="grow"></div><div class="icon-btn">✕</div></div>
    <div class="col center mt24" style="gap:10px">
      <div class="logo" style="width:72px;height:72px;font-size:34px;border-radius:20px">👑</div>
      <div style="font-size:26px;font-weight:800">Columbia Premium</div>
      <div class="sub">Unlock the full spectrum</div>
    </div>
    <div class="glass mt24">
      <div class="row mt8"><span style="color:var(--primary-bright)">✓</span><span>1080P HD generation</span></div>
      <div class="row mt12"><span style="color:var(--primary-bright)">✓</span><span>No ads</span></div>
      <div class="row mt12"><span style="color:var(--primary-bright)">✓</span><span>Priority queue</span></div>
      <div class="row mt12"><span style="color:var(--primary-bright)">✓</span><span>Bonus monthly credits</span></div>
    </div>
    <div class="grid2 mt16">
      <div class="res r" style="border:1px solid var(--border);border-radius:16px;padding:16px;text-align:center"><b>Weekly</b><br><span class="muted">$4.99</span></div>
      <div class="res r on" style="border-radius:16px;padding:16px;text-align:center"><b>Yearly</b><br><span style="color:#fff">$29.99</span></div>
    </div>
    <button class="btn mt16">Continue</button>
    <div class="row center mt16" style="gap:18px;color:var(--t3);font-size:12px;justify-content:center"><span>Restore</span><span>Terms</span><span>Privacy</span></div>
  </div>
</div>
</body></html>
