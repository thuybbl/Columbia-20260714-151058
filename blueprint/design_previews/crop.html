<!doctype html><html><head><meta charset="utf-8"><title>Crop</title><link rel="stylesheet" href="style.css"></head><body>
<div class="phone" style="background:#050308"><div class="screen-name">Crop</div>
  <div class="scroll">
    <div class="status"></div>
    <div class="topbar"><div class="icon-btn">←</div><div class="grow" style="text-align:center;font-weight:800;font-size:18px">Crop</div><span style="color:var(--primary-bright);font-weight:800">Done</span></div>
    <div style="margin-top:20px;height:440px;border-radius:16px;background:linear-gradient(135deg,#f472b6,#a855f7);position:relative;overflow:hidden">
      <div style="position:absolute;inset:40px 30px;border:2px solid #fff;border-radius:6px;box-shadow:0 0 0 2000px rgba(0,0,0,.5)"></div>
    </div>
    <div class="chips mt24" style="justify-content:center">
      <span class="chip on">9:16</span><span class="chip">1:1</span><span class="chip">16:9</span><span class="chip">Free</span><span class="chip">⟳ Rotate</span>
    </div>
  </div>
</div>
</body></html>
