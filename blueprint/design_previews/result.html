<!doctype html><html><head><meta charset="utf-8"><title>Result</title><link rel="stylesheet" href="style.css"></head><body>
<div class="phone"><div class="screen-name">Result</div>
  <div class="scroll">
    <div class="status"></div>
    <div class="topbar"><div class="icon-btn">←</div><div class="grow" style="text-align:center;font-weight:800;font-size:18px">Your video</div><div style="width:44px"></div></div>
    <div style="margin-top:14px;height:420px;border-radius:20px;background:linear-gradient(135deg,#6D28D9,#C026D3);display:grid;place-items:center;font-size:52px">▷</div>
    <div class="card mt16">
      <div class="sub">Prompt</div>
      <div class="mt8">Time-lapse of a flower blooming, macro, vivid colors</div>
      <div class="chips mt12"><span class="chip">720P</span><span class="chip">9:16</span><span class="chip">8s</span></div>
    </div>
    <div class="row mt16" style="gap:12px">
      <button class="btn ghost" style="flex:1">⬇ Save</button>
      <button class="btn ghost" style="flex:1">➤ Share</button>
    </div>
    <button class="btn mt12">✦ Create another</button>
    <div class="spacer"></div>
  </div>
</div>
</body></html>
