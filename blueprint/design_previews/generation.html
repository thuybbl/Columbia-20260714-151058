<!doctype html><html><head><meta charset="utf-8"><title>Generation</title><link rel="stylesheet" href="style.css"></head><body>
<div class="phone"><div class="screen-name">Generation</div>
  <div class="scroll">
    <div class="status"></div>
    <div class="topbar">
      <div class="icon-btn">←</div>
      <div class="grow"></div>
      <div class="credit-pill"><span class="gold">⚡</span>35<span class="plus">+</span></div>
    </div>

    <div class="preview-area mt12">
      <div style="font-size:56px">✦</div>
      <div style="font-weight:800;font-size:18px">Text to Video</div>
      <div class="toggle" style="position:absolute;left:16px;right:16px;bottom:16px">
        <div class="seg on">Text to Video</div>
        <div class="seg">Image to Video</div>
      </div>
    </div>

    <div class="sheet">
      <div class="handle"></div>
      <div class="field">Time-lapse of a flower blooming, macro, vivid colors</div>
      <div class="row mt16"><span class="sub">Try an idea</span><div class="grow"></div><span style="color:var(--primary-bright);font-weight:700">⇄ Surprise me</span></div>
      <div class="chips mt12">
        <span class="chip">Neon city</span><span class="chip">Space cat</span><span class="chip">Cherry blossom</span><span class="chip">Ocean</span>
      </div>

      <div class="label-caps mt24">Resolution</div>
      <div class="res mt12">
        <div class="r on">720P</div>
        <div class="r">1080P <small>🔒 HD</small></div>
      </div>

      <div class="label-caps mt24">Aspect ratio</div>
      <div class="chips mt12">
        <span class="chip on">9:16</span><span class="chip">16:9</span><span class="chip">1:1</span><span class="chip">4:3</span><span class="chip">3:4</span>
      </div>

      <div class="label-caps mt24">Duration</div>
      <div class="row"><span class="muted">2s</span><div class="grow slider"><div class="knob"></div></div><span class="muted">15s</span></div>
      <div style="text-align:center;font-weight:800;color:var(--primary-bright)">8s</div>

      <div class="btn ghost mt16">▷ Watch 10 ads to create free</div>

      <div class="row mt16">
        <div class="col"><small class="muted">Generate</small><b class="gold" style="font-size:20px">⚡20</b></div>
        <div class="grow"></div>
        <button class="btn" style="width:auto;flex:1;margin-left:16px">✦ Generate</button>
      </div>
      <div class="spacer"></div>
    </div>
  </div>
</div>
</body></html>
