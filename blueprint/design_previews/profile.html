<!doctype html><html><head><meta charset="utf-8"><title>Profile</title><link rel="stylesheet" href="style.css"></head><body>
<div class="phone"><div class="screen-name">Profile</div>
  <div class="scroll" style="padding-bottom:110px">
    <div class="status"></div>
    <div class="mt8 label-caps">Account</div>
    <div class="screen-title">Profile</div>

    <div class="glass mt16" style="background:linear-gradient(120deg,rgba(124,58,237,.35),rgba(192,38,211,.25))">
      <div class="row">
        <div class="logo" style="border-radius:50%">⚡</div>
        <div class="col"><span class="sub">Your balance</span><b style="font-size:22px">35 credits</b></div>
        <div class="grow"></div>
        <button class="btn sm">Get credits</button>
      </div>
    </div>

    <div class="grid2 mt16">
      <div class="opt"><div class="opt-ico">👑</div><b>Premium</b></div>
      <div class="opt"><div class="opt-ico">＋</div><b>Get credits</b></div>
      <div class="opt"><div class="opt-ico">▷</div><b>Watch an ad · +2 credits</b></div>
      <div class="opt"><div class="opt-ico">↺</div><b>Restore purchase</b></div>
      <div class="opt"><div class="opt-ico">⚙</div><b>Settings</b></div>
    </div>
    <div class="spacer240"></div>
  </div>
  <div class="fab">✦</div>
  <div class="bottomnav">
    <div class="nav-item"><span class="i">🏠</span>Home</div>
    <div class="nav-item"><span class="i">🎞</span>Gallery</div>
    <div class="nav-item on"><span class="i">👤</span>Profile</div>
  </div>
</div>
</body></html>
