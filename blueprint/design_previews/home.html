<!doctype html><html><head><meta charset="utf-8"><title>Home</title><link rel="stylesheet" href="style.css"></head><body>
<div class="phone"><div class="screen-name">Home</div>
  <div class="scroll" style="padding-bottom:110px">
    <div class="status"></div>
    <div class="topbar">
      <div class="logo">✦</div>
      <div class="app-title">Columbia</div>
      <div class="grow"></div>
      <div class="credit-pill"><span class="gold">⚡</span>35<span class="plus">+</span></div>
      <div class="icon-btn">⚙</div>
    </div>

    <div class="hero mt16">
      <div class="display">Turn ideas &amp; photos<br>into AI videos</div>
      <div class="input-bar">
        <span style="color:var(--primary-bright)">✦</span>
        <span class="ph">Describe it, we animate it</span>
        <div class="send">→</div>
      </div>
    </div>

    <div class="row mt16" style="gap:12px;align-items:stretch">
      <div class="mode-card">
        <div class="mode-ico">T</div>
        <div><b>Text to Video</b><br><small>Describe it, we animate it</small></div>
      </div>
      <div class="mode-card">
        <div class="mode-ico">🖼</div>
        <div><b>Image to Video</b><br><small>Bring your photo to life</small></div>
      </div>
    </div>

    <div class="mt24 label-caps">Spectrum</div>
    <div class="section-title">Trending effects</div>
    <div class="grid2 mt12">
      <div class="effect pink">AI Hug</div>
      <div class="effect">AI Kiss</div>
      <div class="effect green">Muscle</div>
      <div class="effect pink">Baby</div>
      <div class="effect amber">Aging</div>
      <div class="effect">Polaroid</div>
    </div>
    <div class="spacer240"></div>
  </div>

  <div class="fab">✦</div>
  <div class="bottomnav">
    <div class="nav-item on"><span class="i">🏠</span>Home</div>
    <div class="nav-item"><span class="i">🎞</span>Gallery</div>
    <div class="nav-item"><span class="i">👤</span>Profile</div>
  </div>
</div>
</body></html>
