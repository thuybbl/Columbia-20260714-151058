<!doctype html><html><head><meta charset="utf-8"><title>Top up</title><link rel="stylesheet" href="style.css"></head><body>
<div class="phone"><div class="screen-name">Top up · Credits</div>
  <div class="scroll">
    <div class="status"></div>
    <div class="topbar"><div class="icon-btn">←</div><div class="col"><span class="label-caps">Top up</span><span class="screen-title" style="font-size:24px">Credits</span></div></div>

    <div class="mt16" style="border-radius:20px;padding:22px;background:var(--grad-bal);box-shadow:0 0 40px rgba(192,38,211,.35)">
      <div class="row"><div style="font-size:30px">⚡</div><div class="col"><span class="sub" style="color:rgba(255,255,255,.8)">Your balance</span><b style="font-size:26px">35 credits</b></div></div>
    </div>

    <div class="card mt16 row"><div class="opt-ico" style="color:var(--gold);background:rgba(245,166,35,.15)">▷</div><b>Watch an ad · +2 credits</b><div class="grow"></div><span class="muted">›</span></div>

    <div class="mt24 label-caps">Spectrum packs</div>
    <div class="section-title">Get credits</div>

    <div class="mt12 pack"><div style="font-size:26px" class="gold">⚡</div><b style="font-size:30px">50</b><span class="muted">credits</span><button class="btn mt8">$1.00</button></div>
    <div class="grid2 mt12">
      <div class="pack"><div style="font-size:22px" class="gold">⚡</div><b style="font-size:26px">190</b><span class="muted">credits</span><span style="color:var(--primary-bright);font-size:13px">+27% extra</span><button class="btn mt8">$1.00</button></div>
      <div class="pack pop"><div class="badge">POPULAR</div><div style="font-size:22px" class="gold">⚡</div><b style="font-size:26px">300</b><span class="muted">credits</span><span style="color:var(--primary-bright);font-size:13px">+20% extra</span><button class="btn mt8">$1.00</button></div>
    </div>
    <div class="spacer"></div>
  </div>
</div>
</body></html>
