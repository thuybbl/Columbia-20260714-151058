<!doctype html><html><head><meta charset="utf-8"><title>Gallery</title><link rel="stylesheet" href="style.css"></head><body>
<div class="phone"><div class="screen-name">Gallery — empty</div>
  <div class="scroll" style="padding-bottom:110px">
    <div class="status"></div>
    <div class="mt8 label-caps">Your spectrum</div>
    <div class="screen-title">My creations</div>

    <div class="col center" style="margin-top:180px;gap:14px">
      <div class="empty-ico">🎞</div>
      <div class="section-title">No videos yet</div>
      <div class="sub">Your generated videos will appear here.</div>
      <button class="btn" style="width:auto;padding:15px 34px;margin-top:6px">✦ Create a video</button>
    </div>
  </div>
  <div class="fab">✦</div>
  <div class="bottomnav">
    <div class="nav-item"><span class="i">🏠</span>Home</div>
    <div class="nav-item on"><span class="i">🎞</span>Gallery</div>
    <div class="nav-item"><span class="i">👤</span>Profile</div>
  </div>
</div>

<div class="phone"><div class="screen-name">Gallery — filled</div>
  <div class="scroll" style="padding-bottom:110px">
    <div class="status"></div>
    <div class="mt8 label-caps">Your spectrum</div>
    <div class="screen-title">My creations</div>
    <div class="grid2 mt16">
      <div class="effect pink" style="height:200px">▷ 0:08</div>
      <div class="effect" style="height:200px">▷ 0:05</div>
      <div class="effect green" style="height:200px">▷ 0:10</div>
      <div class="effect amber" style="height:200px">▷ 0:06</div>
    </div>
    <div class="spacer240"></div>
  </div>
  <div class="fab">✦</div>
  <div class="bottomnav">
    <div class="nav-item"><span class="i">🏠</span>Home</div>
    <div class="nav-item on"><span class="i">🎞</span>Gallery</div>
    <div class="nav-item"><span class="i">👤</span>Profile</div>
  </div>
</div>
</body></html>
